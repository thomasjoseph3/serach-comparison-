<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>The Salesperson · Jewelry AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

  <!-- Login screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="modal-gem">💎</div>
      <h1 class="modal-title">The Salesperson</h1>
      <p class="modal-sub">Sign in to continue</p>
      <div id="loginError" class="login-error" style="display:none"></div>
      <div class="login-field">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="user1 / user2 / user3" autocomplete="username" />
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-start" id="btnLogin">Sign in →</button>
    </div>
  </div>

  <!-- Tool selector overlay (shown after login) -->
  <div class="tool-overlay" id="toolOverlay" style="display:none">
    <div class="tool-modal">
      <div class="modal-gem">💎</div>
      <h1 class="modal-title">The Salesperson</h1>
      <p class="modal-sub" id="welcomeName">Your personal fine jewelry assistant</p>
      <p class="modal-prompt">Choose your search engine</p>
      <div class="tool-options" id="toolOptions">
        <button class="tool-option active" data-tool="serpapi">
          <span class="tool-icon">🔍</span>
          <span class="tool-name">SerpAPI</span>
          <span class="tool-desc">Google Shopping</span>
        </button>
        <button class="tool-option" data-tool="exa">
          <span class="tool-icon">✦</span>
          <span class="tool-name">Exa</span>
          <span class="tool-desc">Neural web search</span>
        </button>
      </div>
      <p class="modal-prompt" style="margin-top:24px">Your region</p>
      <div class="country-options" id="countryOptions">
        <button class="country-option active" data-country="in">
          <span>🇮🇳</span> India
        </button>
        <button class="country-option" data-country="us">
          <span>🇺🇸</span> USA
        </button>
        <button class="country-option" data-country="jp">
          <span>🇯🇵</span> Japan
        </button>
      </div>
      <button class="btn-start" id="btnStart">Begin →</button>
    </div>
  </div>

  <!-- Search history panel -->
  <div class="compare-modal hidden" id="compareModal">
    <div class="compare-content">
      <div class="compare-header">
        <h2>Your Search History</h2>
        <button class="compare-close" id="compareClose">✕</button>
      </div>
      <div class="compare-searches" id="compareSearches">
        <div class="compare-empty"><p>No searches yet. Start searching!</p></div>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div class="app" id="app" style="display:none">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <span class="brand-gem">💎</span>
        <span class="brand-name">The Salesperson</span>
      </div>
      <div class="header-right">
        <button class="active-tool-btn" id="activeToolBtn" title="Switch search engine">
          <span id="activeToolIcon">🔍</span>
          <span id="activeToolName">SerpAPI</span>
          <span class="chevron">▾</span>
        </button>
        <button class="btn-compare" id="btnCompare" title="Search history" style="display:none">📊</button>
        <span class="country-badge" id="countryBadge" title="Region">🇮🇳</span>
        <span class="user-badge" id="userBadge" title="Logged in user">👤</span>
        <button class="btn-new" id="btnClear" title="New conversation">↺</button>
        <button class="btn-logout" id="btnLogout" title="Sign out">⎋</button>
      </div>
      <!-- Tool dropdown -->
      <div class="tool-dropdown" id="toolDropdown" style="display:none">
        <button class="dropdown-item" data-tool="serpapi">🔍 SerpAPI <small>Google Shopping</small></button>
        <button class="dropdown-item" data-tool="exa">✦ Exa <small>Neural search</small></button>
      </div>
    </header>

    <!-- Messages -->
    <main class="messages" id="messages"></main>

    <!-- Input -->
    <footer class="input-wrap">
      <div class="input-bar">
        <textarea id="input" placeholder="Ask me about any jewelry…" rows="1"></textarea>
        <button id="btnSend" class="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
